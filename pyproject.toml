[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organs"
version = "0.1.0"
description = "Class-colored silhouette to specimen image synthesis (SPADE / OASIS style GAN)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pillow>=10",
  "numpy>=1.26",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
cutout = ["rembg[cpu]>=2.0.60", "scipy>=1.11"]
train = ["torch>=2.4", "torchvision>=0.19"]

[project.scripts]
organs = "organs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
